name: doctor-smoke

# What this is: the automated half of Bolo Doctor testing. A real Windows
# runner installs the app, runs the doctor check suite (structuring safety
# contract, note shape, local history, print/share outputs, and the doctor
# window itself), and then boots the app the way a doctor would — asserting it
# stays alive with no uncaught exceptions.
#
# What it is not: a microphone, Hinglish speech, live Sarvam/Groq keys, a real
# printer, or WhatsApp on a doctor's machine. Dictation quality still needs a
# human voice. This catches everything below that layer.

on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'server/**', 'package.json', 'package-lock.json']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install dependencies
        run: npm ci

      - name: static checks (syntax + require graph)
        run: npm run check

      - name: doctor check suite
        timeout-minutes: 10
        run: |
          npx electron tools/doctor-check.js 2>&1 | Tee-Object -FilePath doctor-check.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: upload doctor check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-check-log
          path: doctor-check.log

      - name: boot Bolo Doctor like a doctor would
        timeout-minutes: 5
        run: |
          $p = Start-Process npx -ArgumentList 'electron','.' -WorkingDirectory "$PWD" -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Output 'BOLO DOCTOR BOOT FAILED - the process exited on its own'
            Get-Content err.log
            exit 1
          }
          $err = ''
          if (Test-Path err.log) { $err = Get-Content err.log -Raw }
          if ($err -match 'Uncaught Exception') {
            Write-Output 'UNCAUGHT EXCEPTION DURING BOLO DOCTOR BOOT'
            Write-Output $err
            $p.Kill()
            exit 1
          }
          Write-Output 'bolo doctor boot ok - alive after 30s, no uncaught exceptions'
          $p.Kill()
