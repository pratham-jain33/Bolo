name: doctor-smoke

# What this is: the automated half of Doctor Mode testing. A real Windows
# runner installs the app, runs the doctor check suite (which exercises the
# PowerShell injection sidecar, the vocabulary layer, the note template and
# the doctor window itself), and then boots Doctor Mode the way a doctor
# would — asserting it stays alive with no uncaught exceptions.
#
# What it is not: a microphone, Hindi/Hinglish speech, or a real clinic app.
# The dictation-to-paste path into actual clinic software still needs a human
# on a real machine. This catches everything below that layer.

on:
  push:
    branches: [main]
    paths: ['bolo-new/**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bolo-new
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bolo-new/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: static checks (syntax + require graph)
        run: npm run check

      - name: doctor check suite
        run: npx electron tools/doctor-check.js
        timeout-minutes: 10

      - name: boot Doctor Mode like a doctor would
        timeout-minutes: 5
        run: |
          $p = Start-Process npx -ArgumentList 'electron','.','--doctor' -WorkingDirectory "$PWD" -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Output 'DOCTOR BOOT FAILED - the process exited on its own'
            Get-Content err.log
            exit 1
          }
          $err = ''
          if (Test-Path err.log) { $err = Get-Content err.log -Raw }
          if ($err -match 'Uncaught Exception') {
            Write-Output 'UNCAUGHT EXCEPTION DURING DOCTOR BOOT'
            Write-Output $err
            $p.Kill()
            exit 1
          }
          Write-Output 'doctor boot ok - alive after 30s, no uncaught exceptions'
          $p.Kill()
