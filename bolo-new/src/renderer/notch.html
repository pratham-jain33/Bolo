<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:"
  />
  <title>bolo notch</title>
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./notch.css" />
</head>
<body>
  <!-- The capsule is flush with the top of the screen and is the only opaque
       thing in this window; everything else is transparent gutter. It is not
       there for a shadow — the capsule casts none — but for the ears, the two
       inverse-corner fillets .notch::before/::after hang outside the capsule's
       box at 16px either side. -->
  <div id="notch" class="notch" data-phase="idle">
    <!-- Three-column cap: left wing (waveform/ring) | centred logo | right wing (mode + close).
         1fr/auto/1fr grid keeps the logo perfectly centred as both wings grow together. -->
    <div class="cap">
      <span class="cap-left" id="capLeft" aria-hidden="true">
        <span class="meter" id="meter"></span>
        <span class="ring" id="ring"></span>
      </span>
      <span class="cap-logo" id="capLogo" aria-hidden="true"></span>
      <span class="cap-right" id="capRight">
        <span class="mode" id="mode" data-mode="" hidden></span>
        <button class="x" id="x" type="button" aria-label="Dismiss" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round">
            <path d="M5 5l14 14M19 5L5 19" />
          </svg>
        </button>
      </span>
    </div>

    <div class="body" id="body">
      <div class="headline" id="headline"></div>
      <div class="slot" id="slot"></div>
      <div class="actions" id="actions"></div>
    </div>

    <div class="hint" id="hint">
      <span class="hint-text">Press</span>
      <!-- Keycaps are built at runtime from whatever the voice key is actually
           bound to. The reference hard-codes macOS's "alt" / "control" chips on
           every platform; printing the real binding is both truthful and the
           only way the line survives the user rebinding the key. -->
      <span class="hint-keys" id="hintKeys"></span>
      <span class="hint-text">to speak</span>
    </div>
  </div>

  <div id="diag" class="diag" hidden></div>
  <!-- diag.js is FIRST, in its own file: a parse error kills the script that
       contains it along with any handler it would have installed, so the only
       thing that can report one is a script above it. This window went blank
       with zero diagnostics for exactly that reason. -->
  <script src="./diag.js"></script>
  <script src="../shared/keylabel.js"></script>
  <script src="./speak.js"></script>
  <script src="./wordmark.js"></script>
  <script src="./notch.js"></script>
</body>
</html>
